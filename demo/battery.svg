<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640">
  <!-- A made-up phone screen for the demo: the battery is past 85% and no alert came. -->
  <rect width="480" height="640" fill="#1b2027"/>
  <rect x="0" y="0" width="480" height="44" fill="#12161b"/>
  <text x="24" y="29" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="17">09:02</text>
  <rect x="380" y="15" width="40" height="18" rx="4" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <rect x="421" y="20" width="4" height="8" rx="1" fill="#e6edf3"/>
  <rect x="383" y="18" width="29" height="12" rx="2" fill="#3fb950"/>
  <text x="372" y="29" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="15" text-anchor="end">86%</text>
  <text x="240" y="230" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="96" font-weight="300" text-anchor="middle">86%</text>
